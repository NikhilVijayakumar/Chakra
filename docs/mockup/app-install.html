<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installing App — Chakra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* OKLCH Color System - Warm, perceptual uniform */
  --primary: oklch(52% 0.18 265);
  --primary-light: oklch(65% 0.14 265);
  --primary-dark: oklch(40% 0.20 265);
  --ph: oklch(45% 0.16 265);
  --success: oklch(62% 0.16 150);
  --error: oklch(55% 0.20 30);
  --gray-100: oklch(98% 0.005 85);
  --gray-200: oklch(94% 0.008 80);
  --gray-300: oklch(88% 0.012 75);
  --gray-400: oklch(74% 0.018 70);
  --gray-500: oklch(60% 0.022 65);
  --gray-600: oklch(46% 0.018 60);
  --gray-700: oklch(34% 0.015 55);
  --gray-800: oklch(26% 0.012 50);
  --gray-900: oklch(18% 0.008 45);
  
  /* ===== KINETIC MINIMALISM TOKENS ===== */
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --duration-slow: 300ms;
  --duration-dramatic: 400ms;
  
  --ease-snap: cubic-bezier(0.12, 0, 0.08, 1);
  --ease-respond: cubic-bezier(0, 0, 0.2, 1);
  --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-gentle: cubic-bezier(0.25, 0.1, 0.25, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-morph: cubic-bezier(0.42, 0, 0.58, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);

  /* Animation - Stagger delays for cascade */
  --el: 50ms;
  
  /* Shadows and Effects */
  --sh: rgba(0,0,0,0.15);
  
  /* Form inputs */
  --ib: oklch(0.18 0.008 45);
  --ibr: oklch(0.26 0.012 50);
}
[data-theme="dark"]{
  --mui-bg-default: #090B10;
  --mui-bg-paper: #12141A;
  --mui-text-primary: #F2F2F3;
  --mui-text-secondary: #8A8F98;
  --mui-divider: #2C3240;

  --bg: var(--mui-bg-default);
  --paper: var(--mui-bg-paper);
  --elev: #1A1D24;
  --tp: var(--mui-text-primary);
  --ts: var(--mui-text-secondary);
  --b: rgba(255,255,255,0.08);
  --d: var(--mui-divider);
  --sh: rgba(0,0,0,0.4);
  --ib: var(--mui-bg-paper);
  --ibr: rgba(255,255,255,0.12);
}
[data-theme="light"]{
  --mui-bg-default: #F7F6F2;
  --mui-bg-paper: #FFFFFF;
  --mui-text-primary: #1A1C23;
  --mui-text-secondary: #687076;
  --mui-divider: rgba(0,0,0,0.08);

  --bg: var(--mui-bg-default);
  --paper: var(--mui-bg-paper);
  --elev: #FFFFFF;
  --tp: var(--mui-text-primary);
  --ts: var(--mui-text-secondary);
  --b: var(--mui-divider);
  --d: #E5E7EB;
  --sh: rgba(0,0,0,0.08);
  --ib: #FFFFFF;
  --ibr: rgba(0,0,0,0.12);
}
:root {
  --mui-primary-main: #5A60F5;
  --primary: var(--mui-primary-main);
}
@supports not (color: oklch(0 0 0)) {
  :root {
    --primary: #5A60F5;
    --primary-light: #7B7FF5;
    --primary-dark: #3A40D5;
    --ph: #5255DF;
    --success: #34C759;
    --warning: #F5A623;
    --error: #ED5F74;
    --gray-100: #F2F0EB;
    --gray-200: #E8E5DF;
    --gray-300: #D4CFC4;
    --gray-400: #A09A8A;
    --gray-500: #6B6565;
    --gray-600: #4A4545;
    --gray-700: #3A3A3A;
    --gray-800: #2A2A2A;
    --gray-900: #1A1A1A;
  }
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif}
h1,h2,h3,h4{font-family:'Inter', 'Segoe UI', sans-serif;font-weight:700;text-wrap:balance}
body{min-height:100vh;background:var(--bg);color:var(--tp);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background var(--duration-normal) var(--ease-snap),color var(--duration-normal) var(--ease-snap)}
.tt{position:fixed;top:24px;right:24px;width:40px;height:40px;border-radius:50%;border:1px solid var(--b);background:var(--paper);color:var(--ts);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--duration-fast) var(--ease-snap);z-index:100}
.tt:hover{color:var(--primary);border-color:var(--primary);transform:scale(1.05)}
.ic{width:16px;height:16px}
.ext{position:fixed;top:24px;left:24px;padding:8px 16px;background:var(--paper);border:1px solid var(--b);border-radius:8px;color:var(--tp);font-size:.875rem;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:8px;transition:all var(--duration-fast) var(--ease-snap)}
.ext:hover{border-color:var(--primary);color:var(--primary)}
.card{background:var(--paper);border:1px solid var(--b);border-radius:16px;padding:48px;text-align:center;max-width:400px;width:100%}
.icon{width:64px;height:64px;border-radius:16px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;transition:background var(--duration-normal) var(--ease-snap)}
.icon svg{width:32px;height:32px;color:#fff}
h1{font-size:1.5rem;font-weight:700;margin-bottom:8px}
p{font-size:.875rem;color:var(--ts);margin-bottom:32px}
.pb-track{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.pb-fill{height:100%;background:var(--primary);width:0%;transition:width 0.2s linear}
.log{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--ts);margin-top:16px;text-align:left}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  
  .tt:hover {
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<a href="home.html" class="ext"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Cancel Install</a>
<button class="tt" onclick="toggleTheme()" aria-label="Toggle theme">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5" class="si2"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" class="sr"/><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" class="mi" style="display:none"/></svg>
</button>

<div class="card">
<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
<h1 id="title">Installing App...</h1>
<p id="desc">Downloading dependencies securely to the local vault.</p>
<div class="pb-track">
<div class="pb-fill" id="pb"></div>
</div>
<div class="log" id="log">> Fetching manifest...</div>
</div>

<script>
function toggleTheme(){var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');u()}
function u(){var d=document.documentElement.getAttribute('data-theme')==='dark';document.querySelector('.si2').style.display=d?'block':'none';document.querySelector('.sr').style.display=d?'block':'none';document.querySelector('.mi').style.display=d?'none':'block'}
u();

const steps = [
  {p: 15, m: "> Fetching manifest...", t: 800},
  {p: 40, m: "> Downloading core packages...", t: 1500},
  {p: 75, m: "> Verifying cryptographic signatures...", t: 2500},
  {p: 95, m: "> Registering with Chakra Platform Runtime...", t: 3500},
  {p: 100, m: "> Installation complete. Routing to Home...", t: 4500}
];

steps.forEach(s => {
  setTimeout(() => {
    document.getElementById('pb').style.width = s.p + '%';
    document.getElementById('log').textContent = s.m;
    if(s.p === 100) {
      document.getElementById('title').textContent = "Installation Complete";
      document.getElementById('desc').textContent = "App is now available in your platform.";
      document.querySelector('.icon').style.background = "var(--success)";
      setTimeout(() => { window.location.href = 'home.html'; }, 1500);
    }
  }, s.t);
});
</script>
</body>
</html>
